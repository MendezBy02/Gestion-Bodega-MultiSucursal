<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexoTech Bodega</title>

  <link rel="icon" href="img/logo.png">

  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/tabla.css">

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="container">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="logo">
      <img src="img/logo.png" class="logo-img">
      <div>
        <h2>Sistema de Bodega</h2>
        <p>NexoTech</p>
      </div>
    </div>

    <ul>
      <li class="active" onclick="mostrarSeccion('dashboard', this)">
        <i data-lucide="layout-dashboard"></i>
        Dashboard
      </li>

      <li onclick="mostrarSeccion('inventario', this)">
        <i data-lucide="box"></i>
        Inventario
      </li>

      <li onclick="mostrarSeccion('sucursales', this)">
        <i data-lucide="building"></i>
        Sucursales
      </li>

      <li onclick="mostrarSeccion('transferencias', this)">
        <i data-lucide="arrow-left-right"></i>
        Transferencias
      </li>
    </ul>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <div class="topbar-left">
        <span id="toggleBtn" class="menu-btn">☰</span>
      </div>

      <div class="topbar-right">
        <div class="user-info">
          <span>Administrador</span>
          <small>Sistema Central</small>
        </div>
        <div class="avatar">A</div>
      </div>

    </div>

    <!-- CONTENIDO -->
    <section id="dashboard">
      <h1>Panel de Control</h1>
      <p>Contenido del dashboard...</p>
    </section>

    <section id="inventario" style="display:none;">
      <h1>Inventario</h1>
    </section>

    <section id="sucursales" style="display:none;">
      <h1>Sucursales</h1>
    </section>

    <section id="transferencias" style="display:none;">
      <h1>Transferencias</h1>
    </section>

  </main>

</div>

<script>
  lucide.createIcons();
</script>

<script src="js/app.js"></script>

</body>
</html>
