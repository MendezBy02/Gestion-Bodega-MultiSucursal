<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sistema de Bodega</title>

  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/sidebar.css">

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="container">

  <!-- sidebar principal -->
  <aside class="sidebar" id="sidebar">

    <!-- header del sidebar -->
    <div class="sidebar-header">
      <span id="toggleBtn">☰</span>
    </div>

    <!-- logo -->
    <div class="logo">
      <h2 id="nombreBodega">Sistema de Bodega</h2>
      <p id="subtituloBodega">Multisucursal</p>
    </div>

    <!-- usuario -->
    <div class="user">
      <p id="userEmail"></p>
    </div>

    <!-- menú -->
    <ul>

      <li class="active" onclick="setActive(this); mostrar('dashboard')">
        <i data-lucide="layout-dashboard"></i>
        <span>Dashboard</span>
      </li>

      <li onclick="setActive(this); mostrar('inventario')">
        <i data-lucide="box"></i>
        <span>Inventario</span>
      </li>

      <li onclick="setActive(this); mostrar('sucursales')">
        <i data-lucide="building"></i>
        <span>Sucursales</span>
      </li>

      <li onclick="setActive(this); mostrar('transferencias')">
        <i data-lucide="arrow-left-right"></i>
        <span>Transferencias</span>
      </li>

      <!-- sección admin -->
      <li id="adminSection" onclick="setActive(this); mostrar('usuarios')">
        <i data-lucide="user-plus"></i>
        <span>Registrar Usuarios</span>
      </li>

    </ul>

    <!-- footer -->
     
   <div class="user-info">
      <span id="nombreUsuario">Usuario</span>
    </div>

    <div class="sidebar-footer">

    <li onclick="logout()">
        <i data-lucide="log-out"></i>
        <span>Cerrar Sesion</span>
    </li>

    </div>

  </aside>

  <!-- contenido -->
  <main class="main">

    <section id="dashboard">
      <h2>Dashboard</h2>
    </section>

    <section id="inventario" style="display:none;">
      <h2>Inventario</h2>
    </section>

    <section id="sucursales" style="display:none;">
      <h2>Sucursales</h2>
    </section>

    <section id="transferencias" style="display:none;">
      <h2>Transferencias</h2>
    </section>

    <section id="usuarios" style="display:none;">
      <h2>Registro de Usuarios</h2>
    </section>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="js/app.js"></script>

<script>
  lucide.createIcons();
</script>

</body>
</html>
